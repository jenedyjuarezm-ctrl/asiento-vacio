<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Asiento Vacío | Simulador ONU Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Fondo de circuitos animados -->
    <div id="circuit-bg"></div>

    <div id="app">
        <!-- Pantalla de Inicio -->
        <section id="screen-start" class="screen active">
            <div class="glass-panel">
                <div class="logo pulse">🇺🇳</div>
                <h1 class="glitch" data-text="El Asiento Vacío">El Asiento Vacío</h1>
                <p class="subtitle">SISTEMA DE SIMULACIÓN GEOPOLÍTICA. Toma el poder del veto.</p>
                
                <div class="input-group">
                    <label for="country-search">Identifica tu nación para ocupar el asiento:</label>
                    <input type="text" id="country-search" placeholder="Ej. Cuba, México, Rusia..." autocomplete="off">
                    <ul id="country-list" class="dropdown-list hidden"></ul>
                </div>

                <button id="btn-start" class="btn-primary disabled" disabled>INICIAR PROTOCOLO</button>
            </div>
        </section>

        <!-- Pantalla de Juego -->
        <section id="screen-round" class="screen">
            <div class="header-game">
                <span id="country-badge" class="badge">Delegado de...</span>
                <span id="round-counter" class="badge alt">Sector 1/7</span>
            </div>
            
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="glass-panel">
                <h2 id="res-title"></h2>
                <p id="res-context" class="context-text"></p>
                
                <div class="arguments">
                    <div class="arg-box pro">
                        <div class="icon">✅</div>
                        <div><strong>Postura A favor:</strong> <span id="arg-pro"></span></div>
                    </div>
                    <div class="arg-box con">
                        <div class="icon">❌</div>
                        <div><strong>Postura en contra:</strong> <span id="arg-con"></span></div>
                    </div>
                </div>

                <div class="vote-buttons">
                    <button data-vote="favor" class="btn-vote favor">A FAVOR</button>
                    <button data-vote="contra" class="btn-vote contra">VETO / CONTRA</button>
                    <button data-vote="abstencion" class="btn-vote abstencion">ABSTENCIÓN</button>
                </div>
            </div>

            <!-- Panel de Revelación y Análisis -->
            <div id="reveal" class="glass-panel reveal-panel hidden">
                <h3 id="reveal-title">ANÁLISIS DE IMPACTO</h3>
                <p id="reveal-text"></p>
                <div class="analysis-box" id="reveal-analysis"></div>
                <p class="consequence" id="reveal-consequence"></p>
                
                <a id="reveal-source" href="#" target="_blank" class="source-link">
                    🔗 VERIFICAR ARCHIVO OFICIAL DE LA ONU ↗
                </a>
                <button id="btn-next" class="btn-primary">SIGUIENTE RESOLUCIÓN →</button>
            </div>
        </section>

        <!-- Pantalla de Resultados -->
        <section id="screen-result" class="screen">
            <div class="glass-panel result-panel">
                <h2 class="glitch" data-text="Informe Final">Informe Final</h2>
                <p id="result-subtitle"></p>
                
                <div class="chart-container">
                    <canvas id="resultChart"></canvas>
                </div>

                <p id="result-text" class="result-text"></p>
                
                <button id="btn-share" class="btn-secondary">📋 COPIAR INFORME</button>
                <button id="btn-restart" class="btn-primary mt-20">NUEVA SIMULACIÓN</button>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
